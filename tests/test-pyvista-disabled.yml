name: Test headless display setup with pyvista disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          pyvista: "false"
          qt: "false"
          wm: "false"

      - name: Assert DISPLAY is set
        run: |
          echo "DISPLAY: $DISPLAY"
          if [ "$DISPLAY" != ":99.0" ]; then
            echo "FAIL: expected DISPLAY=:99.0 but got '$DISPLAY'"
            exit 1
          fi
          echo "PASS: DISPLAY=$DISPLAY"

      - name: Assert PYVISTA_OFF_SCREEN is NOT set
        run: |
          echo "PYVISTA_OFF_SCREEN: '$PYVISTA_OFF_SCREEN'"
          if [ "$PYVISTA_OFF_SCREEN" = "true" ]; then
            echo "FAIL: PYVISTA_OFF_SCREEN should not be set when pyvista=false"
            exit 1
          fi
          echo "PASS: PYVISTA_OFF_SCREEN is not set (as expected)"

      - name: Assert Xvfb is running
        run: |
          if ! pgrep -x Xvfb > /dev/null; then
            echo "FAIL: Xvfb is not running"
            exit 1
          fi
          echo "PASS: Xvfb is running"
