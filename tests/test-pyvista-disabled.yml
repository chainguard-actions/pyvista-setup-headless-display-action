name: Test pyvista disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          pyvista: "false"
          qt: "false"
          wm: "false"

      - name: Assert DISPLAY is set (Xvfb still starts)
        run: |
          echo "DISPLAY=$DISPLAY"
          if [ -z "$DISPLAY" ]; then
            echo "FAIL: DISPLAY is not set"
            exit 1
          fi
          echo "PASS: DISPLAY=$DISPLAY"

      - name: Assert PYVISTA_OFF_SCREEN is NOT set
        run: |
          echo "PYVISTA_OFF_SCREEN='$PYVISTA_OFF_SCREEN'"
          if [ "$PYVISTA_OFF_SCREEN" = "true" ]; then
            echo "FAIL: PYVISTA_OFF_SCREEN should not be set when pyvista=false"
            exit 1
          fi
          echo "PASS: PYVISTA_OFF_SCREEN is not set to true"

      - name: Assert Xvfb is running
        run: |
          if ! pgrep -x Xvfb > /dev/null 2>&1; then
            echo "FAIL: Xvfb is not running"
            exit 1
          fi
          echo "PASS: Xvfb is running"
