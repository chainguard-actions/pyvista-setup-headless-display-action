name: Test herbstluftwm window manager
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          pyvista: "true"
          qt: "false"
          wm: "herbstluftwm"

      - name: Assert DISPLAY is set (Xvfb started for herbstluftwm)
        run: |
          echo "DISPLAY=$DISPLAY"
          if [ -z "$DISPLAY" ]; then
            echo "FAIL: DISPLAY is not set"
            exit 1
          fi
          echo "PASS: DISPLAY=$DISPLAY"

      - name: Assert XDG_SESSION_TYPE is x11
        run: |
          echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
          if [ "$XDG_SESSION_TYPE" != "x11" ]; then
            echo "FAIL: XDG_SESSION_TYPE is not 'x11', got '$XDG_SESSION_TYPE'"
            exit 1
          fi
          echo "PASS: XDG_SESSION_TYPE=x11"

      - name: Assert PYVISTA_OFF_SCREEN is set
        run: |
          echo "PYVISTA_OFF_SCREEN=$PYVISTA_OFF_SCREEN"
          if [ "$PYVISTA_OFF_SCREEN" != "true" ]; then
            echo "FAIL: PYVISTA_OFF_SCREEN is not 'true'"
            exit 1
          fi
          echo "PASS: PYVISTA_OFF_SCREEN=true"

      - name: Assert Xvfb is running
        run: |
          if ! pgrep -x Xvfb > /dev/null 2>&1; then
            echo "FAIL: Xvfb is not running"
            exit 1
          fi
          echo "PASS: Xvfb is running"

      - name: Assert herbstluftwm is running
        run: |
          if ! pgrep -x herbstluftwm > /dev/null 2>&1; then
            echo "FAIL: herbstluftwm is not running"
            exit 1
          fi
          echo "PASS: herbstluftwm is running"

      - name: Assert herbstclient can communicate with herbstluftwm
        run: |
          herbstclient version > /dev/null 2>&1
          echo "PASS: herbstclient version succeeded"
