name: Test latest release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, macos-13, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12
      - run: pip install pyvista
      - name: Use PyVista
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: python -c "import pyvista;pyvista.Sphere().plot(screenshot='${MATRIX_OS}-sphere.png')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.os }}-sphere
          path: ${{ matrix.os }}-sphere.png
          if-no-files-found: error
