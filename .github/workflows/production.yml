name: Test latest release

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.12
      - run: pip install pyvista
      - name: Use PyVista
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: python -c "import pyvista,os;pyvista.Sphere().plot(screenshot=os.environ['MATRIX_OS']+'-sphere.png')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.os }}-sphere
          path: ${{ matrix.os }}-sphere.png
          if-no-files-found: error
